name: Nightly data sync

# Runs every night at 09:00 UTC (04:00 ET / 05:00 EDT).
# FDIC publishes new financials a few weeks after each quarter end —
# a nightly cadence keeps the snapshot fresh without hammering their API.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: # allow manual triggers from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sync FDIC institutions, latest financials, failures, analytics, FRED
        env:
          BASE_URL: ${{ vars.SYNC_BASE_URL }} # e.g. https://bank-data.your-domain.workers.dev
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ] || [ -z "${PIPELINE_SECRET:-}" ]; then
            echo "SYNC_BASE_URL var and PIPELINE_SECRET secret must be set." >&2
            exit 1
          fi

          run_stage () {
            local stage="$1"
            echo "::group::stage=$stage"
            local resp
            resp=$(curl -sS -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer $PIPELINE_SECRET" \
              "$BASE_URL/api/v1/pipeline/sync?stage=$stage")
            local body status
            body=$(echo "$resp" | sed '$d')
            status=$(echo "$resp" | tail -n1)
            echo "$body"
            echo "::endgroup::"
            if [ "$status" != "200" ]; then
              echo "Stage $stage failed with status $status" >&2
              exit 1
            fi
          }

          run_stage institutions
          run_stage snapshot
          run_stage failures
          run_stage analytics
          run_stage trends
          run_stage anomalies
          run_stage risk
          run_stage fred
          run_stage correlations
