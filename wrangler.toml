name = "bank-data"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "bank_data"
database_id = "02ed8ae2-1176-4be8-8be4-ee166ffa8ced"

[[kv_namespaces]]
binding = "CACHE"
id = "91ae8f4539cf4043acb6dff65543e98b"

[[r2_buckets]]
binding = "EXPORTS"
bucket_name = "bank-exports"

# FRED API key - set via: wrangler secret put FRED_API_KEY
# Pipeline sync auth - set via: wrangler secret put PIPELINE_SECRET
# [vars]
# FRED_API_KEY = "" # Do NOT put actual key here; use wrangler secret put
# PIPELINE_SECRET = "" # Do NOT put actual key here; use wrangler secret put

# Nightly sync runs via GitHub Actions (.github/workflows/nightly-sync.yml).
# Set repo var SYNC_BASE_URL and repo secret PIPELINE_SECRET to wire it up.
# Cloudflare cron triggers would also work, but adapter-cloudflare doesn't
# currently expose a scheduled() handler — the GH Action path is simpler.
